<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Surprise</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-1: #070312;
    --bg-2: #12041f;
    --bg-3: #1b0b31;
    --pink: #ff4cc4;
    --pink-strong: #ff2ea6;
    --purple: #8a5cff;
    --violet: #5a2cff;
    --blue: #52d7ff;
    --gold: #ffe28c;
    --gold-strong: #ffbf00;
    --white: #ffffff;
    --glass: rgba(255,255,255,0.07);
    --glass-strong: rgba(255,255,255,0.14);
    --shadow: rgba(0,0,0,0.42);
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 20%, rgba(138,92,255,0.42), transparent 23%),
        radial-gradient(circle at 80% 20%, rgba(255,76,196,0.3), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(82,215,255,0.18), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
    color: var(--white);
    letter-spacing: 0.01em;
}

button, input {
    font: inherit;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    animation: floatOrb 12s ease-in-out infinite alternate;
}

.orb.one {
    width: 260px;
    height: 260px;
    background: rgba(255, 85, 194, 0.9);
    top: -70px;
    left: -60px;
}

.orb.two {
    width: 340px;
    height: 340px;
    background: rgba(122, 89, 255, 0.9);
    bottom: -140px;
    right: -90px;
    animation-delay: 2s;
}

.orb.three {
    width: 200px;
    height: 200px;
    background: rgba(82, 215, 255, 0.78);
    top: 42%;
    left: 42%;
    opacity: 0.18;
    animation-delay: 4s;
}

@keyframes floatOrb {
    0% {
        transform: translate3d(0,0,0) scale(1);
    }
    100% {
        transform: translate3d(42px, -28px, 0) scale(1.18);
    }
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle {
    0% {
        opacity: 0.2;
        transform: scale(0.6);
    }
    100% {
        opacity: 1;
        transform: scale(1.8);
    }
}

/* =========================
   MAIN
========================= */

.app {
    width: 100%;
    min-height: 100vh;
    position: relative;
    display: grid;
    place-items: center;
    padding: 28px;
}

.screen {
    width: min(92vw, 520px);
    position: relative;
    display: none;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(13, 8, 25, 0.44);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 32px;
    padding: clamp(26px, 5vw, 42px) clamp(20px, 4vw, 32px);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 30px 65px rgba(0,0,0,0.42),
        0 0 0 1px rgba(255,255,255,0.02);
}

.screen.active {
    display: block;
}

.surprise-options {
    display: grid;
    gap: 14px;
}

.video-screen {
    width: min(92vw, 960px);
}

.video-screen video {
    display: block;
    width: 100%;
    max-height: 72vh;
    border-radius: 20px;
    background: #000;
}

.video-error {
    margin-top: 14px;
    color: rgba(255,255,255,0.8);
}

/* =========================
   NAME SCREEN
========================= */

.logo {
    width: 82px;
    height: 82px;
    margin: 0 auto 30px;
    border-radius: 26px;
    display: grid;
    place-items: center;
    font-size: 38px;
    background: linear-gradient(135deg, rgba(255,76,196,0.9), rgba(138,92,255,0.95));
    box-shadow:
        0 16px 36px rgba(255,76,196,0.3),
        inset 0 2px 8px rgba(255,255,255,0.25),
        inset 0 -10px 18px rgba(82, 24, 101, 0.2);
    animation: logoFloat 3.2s ease-in-out infinite;
}

@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-10px) rotate(4deg) scale(1.04);
    }
}

.title {
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -1.3px;
    margin-bottom: 14px;
    font-weight: 900;
}

.gradient {
    display: inline-block;
    background: linear-gradient(90deg, #ffffff 0%, #ff78d2 20%, #8a5cff 45%, #52d7ff 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientMove 5s linear infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

.subtitle {
    margin-bottom: 28px;
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    letter-spacing: 0.02em;
}

.input-box {
    position: relative;
    margin-bottom: 18px;
}

input {
    width: 100%;
    height: 62px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    color: var(--white);
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    padding: 0 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: 0.3s ease;
    outline: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}

input::placeholder {
    color: rgba(255,255,255,0.38);
}

input:focus {
    border-color: rgba(255,76,196,0.8);
    box-shadow:
        0 0 0 5px rgba(255,76,196,0.12),
        0 18px 38px rgba(255, 76, 196, 0.16);
    background: rgba(255,255,255,0.08);
}

.next-btn {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    color: var(--white);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #ff73d4, #8a5cff 55%, #4dc9ff);
    box-shadow:
        0 16px 28px rgba(138, 92, 255, 0.34),
        0 0 0 1px rgba(255,255,255,0.08);
    transition: transform 0.24s ease, box-shadow 0.24s ease, filter 0.24s ease;
}

.next-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 22px 40px rgba(255,76,196,0.34),
        0 0 0 1px rgba(255,255,255,0.08);
    filter: saturate(1.08);
}

.next-btn:active {
    transform: translateY(0) scale(0.98);
}

/* =========================
   WELCOME SCREEN
========================= */

.welcome-text {
    font-size: clamp(38px, 10vw, 68px);
    line-height: 1.02;
    font-weight: 900;
    opacity: 0;
    transform: scale(0.52) rotate(-10deg);
    letter-spacing: -0.06em;
}

.welcome-text.show {
    animation: welcomePop 1.18s cubic-bezier(0.17, 0.89, 0.32, 1.4) forwards;
}

@keyframes welcomePop {
    0% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.52) rotate(-10deg);
    }
    55% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1.08) rotate(2deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

.welcome-name {
    background: linear-gradient(90deg, #ff8bd8 0%, #a06fff 35%, #66d9ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* =========================
   GIFT
========================= */

.gift-screen {
    perspective: 1600px;
}

.gift-title {
    margin-bottom: 26px;
    font-size: clamp(18px, 4vw, 22px);
    color: rgba(255,255,255,0.8);
    font-weight: 700;
    letter-spacing: 0.02em;
}

.gift-wrapper {
    position: relative;
    width: 230px;
    height: 230px;
    margin: 0 auto;
    cursor: pointer;
    transform-style: preserve-3d;
    animation: giftFloat 4.2s ease-in-out infinite;
    filter: drop-shadow(0 26px 30px rgba(0,0,0,0.35));
    transition: transform 0.28s ease;
}

.gift-wrapper::before {
    content: "";
    position: absolute;
    inset: 38px 22px 18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 96, 196, 0.48), rgba(98, 76, 255, 0.12) 52%, transparent 76%);
    filter: blur(18px);
    opacity: 0.95;
    z-index: 0;
}

.gift-wrapper::after {
    content: "";
    position: absolute;
    inset: 48px 30px 36px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.24), transparent 64%);
    filter: blur(14px);
    opacity: 0.7;
    z-index: 0;
}

@keyframes giftFloat {
    0%, 100% {
        transform: translateY(0) rotateX(0deg) rotateY(0deg);
    }
    25% {
        transform: translateY(-10px) rotateX(4deg) rotateY(-4deg);
    }
    50% {
        transform: translateY(-18px) rotateX(8deg) rotateY(4deg);
    }
    75% {
        transform: translateY(-8px) rotateX(4deg) rotateY(-3deg);
    }
}

.gift-shadow {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 170px;
    height: 32px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.46);
    border-radius: 50%;
    filter: blur(14px);
    animation: shadowPulse 3s ease-in-out infinite;
}

@keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scaleX(0.9); opacity: 0.42; }
    50% { transform: translateX(-50%) scaleX(1.08); opacity: 0.63; }
}

.gift-box {
    position: absolute;
    left: 50%;
    bottom: 26px;
    width: 166px;
    height: 130px;
    transform: translateX(-50%) translateZ(18px);
    border-radius: 22px;
    background: linear-gradient(135deg, #ff4ec6, #ff2c9d 28%, #d42184 100%);
    border: 1px solid rgba(255,255,255,0.19);
    box-shadow:
        0 26px 42px rgba(255, 42, 157, 0.28),
        inset 0 4px 18px rgba(255,255,255,0.17),
        inset 0 -10px 16px rgba(110, 0, 74, 0.16);
    overflow: hidden;
}

.gift-box::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02), rgba(255,255,255,0.18));
    mix-blend-mode: screen;
}

.gift-box::after {
    content: "";
    position: absolute;
    inset: 0 0 0 25%;
    background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.4), rgba(255,255,255,0.05));
    width: 22px;
    height: 100%;
    border-radius: 12px;
}

.gift-lid {
    position: absolute;
    left: 50%;
    top: 30px;
    width: 182px;
    height: 48px;
    transform: translateX(-50%) translateZ(36px);
    border-radius: 18px;
    background: linear-gradient(135deg, #ff7dd8, #ff4fbf 28%, #dc2a8a 100%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
        0 18px 28px rgba(255, 42, 157, 0.2),
        inset 0 4px 10px rgba(255,255,255,0.2),
        inset 0 -6px 10px rgba(98, 0, 51, 0.12);
    transform-origin: 50% 100%;
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.45s ease;
    z-index: 5;
}

.gift-wrapper.opened .gift-lid {
    transform: translateX(-50%) rotateX(-120deg) translateY(-16px) translateZ(42px);
    box-shadow: 0 14px 26px rgba(255, 42, 157, 0.18), inset 0 4px 10px rgba(255,255,255,0.2);
}

.gift-ribbon {
    position: absolute;
    left: 50%;
    top: 0;
    width: 24px;
    height: 100%;
    transform: translateX(-50%);
    border-radius: 20px;
    background: linear-gradient(180deg, #fff7ba, #ffd85a 44%, #ffbf00 100%);
    box-shadow: inset 0 0 0 1px rgba(116, 74, 0, 0.14);
    z-index: 2;
}

.gift-wrapper .gift-ribbon::after,
.gift-wrapper .gift-ribbon::before {
    content: "";
    position: absolute;
    inset: auto 50% 0 50%;
    width: 28px;
    height: 18px;
    border-radius: 16px;
    transform: translate(-50%, 0);
    background: linear-gradient(180deg, #fff1a0, #ffce3d);
}

.gift-box .gift-ribbon {
    left: 50%;
    top: 0;
    height: 130px;
}

.gift-lid .gift-ribbon {
    height: 48px;
}

.bow {
    position: absolute;
    left: 50%;
    top: -20px;
    width: 94px;
    height: 62px;
    transform: translateX(-50%);
    z-index: 6;
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
}

.gift-wrapper.opened .bow {
    transform: translateX(-50%) translateY(-14px) scale(1.06);
}

.bow-left,
.bow-right {
    position: absolute;
    width: 52px;
    height: 42px;
    top: 12px;
    border-radius: 50% 50% 45% 48%;
    background: linear-gradient(135deg, #fff6b9, #ffd75b, #ffbf00);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.36);
}

.bow-left {
    left: -3px;
    transform: rotate(-28deg);
}

.bow-right {
    right: -3px;
    transform: rotate(28deg);
}

.bow-center {
    position: absolute;
    left: 50%;
    top: 16px;
    width: 22px;
    height: 22px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff9d8, #ffce3d 40%, #ffb200 100%);
    box-shadow: 0 0 12px rgba(255, 196, 0, 0.5);
}

.gift-wrapper.opened .gift-box {
    animation: boxPulse 0.7s ease;
}

@keyframes boxPulse {
    0% { transform: translateX(-50%) scale(1); }
    30% { transform: translateX(-50%) scale(1.05); }
    100% { transform: translateX(-50%) scale(1); }
}

.tap-text {
    margin-top: 18px;
    font-size: 18px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.04em;
    animation: tapPulse 1.6s ease-in-out infinite;
}

@keyframes tapPulse {
    0%, 100% { opacity: 0.5; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-4px); }
}

.gift-wrapper.pressing {
    animation: giftPress 0.35s ease;
}

@keyframes giftPress {
    0% { transform: scale(1) rotateX(0deg) rotateY(0deg); }
    28% { transform: scale(0.95) rotateX(8deg) rotateY(-8deg); }
    52% { transform: scale(1.08) rotateX(-5deg) rotateY(6deg); }
    100% { transform: scale(1) rotateX(0deg) rotateY(0deg); }
}

.gift-wrapper.pressing::before,
.gift-wrapper.pressing::after {
    animation: glowBurst 0.45s ease;
}

@keyframes glowBurst {
    0% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 0.9; transform: scale(1); }
}

/* =========================
   FINAL SCREEN
========================= */

.final-screen {
    overflow: visible;
}

.emoji {
    display: inline-block;
    font-size: clamp(106px, 28vw, 180px);
    line-height: 1;
    opacity: 0;
    transform: scale(0.3) rotate(-24deg);
    filter: drop-shadow(0 18px 26px rgba(0,0,0,0.2));
}

.emoji.show {
    animation: emojiBoom 1.2s cubic-bezier(0.17, 0.89, 0.32, 1.3) forwards;
}

@keyframes emojiBoom {
    0% {
        opacity: 0;
        transform: scale(0.2) rotate(-26deg) translateY(30px);
        filter: blur(12px);
    }
    38% {
        opacity: 1;
        transform: scale(1.4) rotate(12deg) translateY(-8px);
        filter: blur(0px);
    }
    72% {
        opacity: 1;
        transform: scale(0.9) rotate(-6deg) translateY(4px);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateY(0);
    }
}

.final-text {
    margin-top: 20px;
    font-size: clamp(42px, 11vw, 70px);
    line-height: 1.04;
    font-weight: 900;
    letter-spacing: -0.06em;
    opacity: 0;
    transform: translateY(24px);
}

.final-text.show {
    animation: finalText 0.95s cubic-bezier(0.17, 0.89, 0.32, 1.3) forwards;
}

@keyframes finalText {
    0% {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(8px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.final-name {
    background: linear-gradient(90deg, #ff9fe2 0%, #a07aff 40%, #64dfff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* =========================
   PARTICLES
========================= */

.particle {
    position: fixed;
    left: 50%;
    top: 50%;
    pointer-events: none;
    z-index: 110;
    font-size: 30px;
    filter: drop-shadow(0 0 14px rgba(255,255,255,0.4));
    animation: particleFly 1.5s ease-out forwards;
}

@keyframes particleFly {
    0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
    }
    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(0.22) rotate(var(--r));
    }
}

.confetti {
    position: fixed;
    top: -20px;
    z-index: 90;
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.35));
    box-shadow: 0 0 10px rgba(255,255,255,0.12);
    animation: confettiFall linear forwards;
}

@keyframes confettiFall {
    0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) translateX(var(--drift)) rotate(720deg);
        opacity: 0;
    }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {
    .app {
        padding: 20px;
    }

    .screen {
        border-radius: 24px;
        padding: 22px 18px;
    }

    .logo {
        width: 72px;
        height: 72px;
        font-size: 32px;
        border-radius: 22px;
    }

    .subtitle {
        font-size: 14px;
    }

    input, .next-btn {
        height: 58px;
    }

    .gift-wrapper {
        transform: scale(0.9);
    }

    .gift-wrapper.opened {
        transform: scale(0.95);
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="stars" id="stars"></div>

<div class="app">

    <!-- NAME SCREEN -->
    <section class="screen active" id="nameScreen">

        <div class="logo">🎁</div>

        <h1 class="title">
            Something <span class="gradient">Special</span>
        </h1>

        <p class="subtitle">
            Enter your name to unlock the surprise ✨
        </p>

        <div class="input-box">
            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name..."
                maxlength="25"
                autocomplete="off"
            >
        </div>

        <button class="next-btn" id="nextBtn">
            Continue ✨
        </button>

    </section>


    <!-- SURPRISE OPTIONS -->
    <section class="screen" id="optionsScreen">

        <h1 class="title">
            Choose your <span class="gradient">Surprise</span>
        </h1>

        <div class="surprise-options">
            <button class="next-btn" id="smallSurpriseBtn">
                Small Surprise ✨
            </button>
            <button class="next-btn" id="bigSurpriseBtn">
                Big Surprise 🎬
            </button>
        </div>

    </section>


    <!-- BIG SURPRISE VIDEO -->
    <section class="screen video-screen" id="videoScreen">

        <video id="surpriseVideo" controls autoplay playsinline preload="auto">
            <source src="video.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
        <p class="video-error" id="videoError" role="status" hidden>
            The video could not play. Use the video controls to try again.
        </p>

    </section>


    <!-- WELCOME SCREEN -->
    <section class="screen" id="welcomeScreen">

        <div class="welcome-text" id="welcomeText">
            Welcome<br>
            <span class="welcome-name" id="welcomeName"></span> 👋
        </div>

    </section>


    <!-- GIFT SCREEN -->
    <section class="screen gift-screen" id="giftScreen">

        <div class="gift-title">
            I have something for you...
        </div>

        <div class="gift-wrapper" id="gift">

            <div class="gift-shadow"></div>

            <div class="gift">

                <div class="gift-ribbon"></div>

            </div>

            <div class="gift-lid">

                <div class="gift-ribbon"></div>

                <div class="bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                </div>

            </div>

        </div>

        <div class="tap-text">
            👆 Tap to open
        </div>

    </section>


    <!-- FINAL SCREEN -->
    <section class="screen final-screen" id="finalScreen">

        <div class="emoji" id="emoji">
                🖕
        </div>

        <div class="final-text" id="finalText">
                Fuck you <span class="final-name" id="finalName"></span>!
        </div>

    </section>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const nameScreen = document.getElementById("nameScreen");
const optionsScreen = document.getElementById("optionsScreen");
const videoScreen = document.getElementById("videoScreen");
const welcomeScreen = document.getElementById("welcomeScreen");
const giftScreen = document.getElementById("giftScreen");
const finalScreen = document.getElementById("finalScreen");

const nameInput = document.getElementById("nameInput");
const nextBtn = document.getElementById("nextBtn");
const smallSurpriseBtn = document.getElementById("smallSurpriseBtn");
const bigSurpriseBtn = document.getElementById("bigSurpriseBtn");
const surpriseVideo = document.getElementById("surpriseVideo");
const videoError = document.getElementById("videoError");

const welcomeText = document.getElementById("welcomeText");
const welcomeName = document.getElementById("welcomeName");

const gift = document.getElementById("gift");

const emoji = document.getElementById("emoji");
const finalText = document.getElementById("finalText");
const finalName = document.getElementById("finalName");

let userName = "";
let giftOpened = false;


/* =========================
   STAR GENERATOR
========================= */

const stars = document.getElementById("stars");

for (let i = 0; i < 70; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    star.style.animationDuration = (1 + Math.random() * 3) + "s";
    stars.appendChild(star);
}

function createAmbientSparkles() {
    const sparkleColors = ["#ffffff", "#ffd3f1", "#8ceaff", "#d9b8ff"];

    for (let i = 0; i < 18; i++) {
        const sparkle = document.createElement("span");
        sparkle.textContent = ["✦", "•", "✨", "❤"][Math.floor(Math.random() * 4)];
        sparkle.style.position = "absolute";
        sparkle.style.left = (10 + Math.random() * 80) + "%";
        sparkle.style.top = (12 + Math.random() * 70) + "%";
        sparkle.style.fontSize = (10 + Math.random() * 14) + "px";
        sparkle.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
        sparkle.style.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
        sparkle.style.filter = "drop-shadow(0 0 10px rgba(255,255,255,0.25))";
        sparkle.style.animation = `ambientFloat ${(2.2 + Math.random() * 3.8)}s ease-in-out infinite alternate`;
        sparkle.style.animationDelay = (Math.random() * 2.5) + "s";
        giftScreen.appendChild(sparkle);
    }

    const sparkleStyle = document.createElement("style");
    sparkleStyle.textContent = `
        @keyframes ambientFloat {
            0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0.2; }
            50% { transform: translate3d(8px, -12px, 0) scale(1.1); opacity: 0.9; }
            100% { transform: translate3d(-10px, 14px, 0) scale(0.9); opacity: 0.45; }
        }
    `;
    document.head.appendChild(sparkleStyle);
}

createAmbientSparkles();


/* =========================
   SCREEN SWITCH
========================= */

function switchScreen(current, next) {
    current.classList.remove("active");

    setTimeout(() => {
        next.classList.add("active");
    }, 100);
}


/* =========================
   NEXT BUTTON
========================= */

nextBtn.addEventListener("click", startExperience);
smallSurpriseBtn.addEventListener("click", startSmallSurprise);
bigSurpriseBtn.addEventListener("click", startBigSurprise);

nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        startExperience();
    }
});

function startExperience() {
    userName = nameInput.value.trim();

    if (!userName) {
        nameInput.focus();
        nameInput.style.animation = "shake .35s ease";

        setTimeout(() => {
            nameInput.style.animation = "";
        }, 400);

        return;
    }

    welcomeName.textContent = userName;

    switchScreen(nameScreen, optionsScreen);
}

function startSmallSurprise() {
    switchScreen(optionsScreen, welcomeScreen);

    setTimeout(() => {
        welcomeText.classList.add("show");
    }, 180);

    setTimeout(() => {
        switchScreen(welcomeScreen, giftScreen);
    }, 2500);
}

function startBigSurprise() {
    switchScreen(optionsScreen, videoScreen);

    surpriseVideo.play().catch(() => {
        videoError.hidden = false;
    });
}

surpriseVideo.addEventListener("error", function () {
    videoError.hidden = false;
});


/* =========================
   GIFT CLICK
========================= */

gift.addEventListener("click", openGift);

function openGift() {
    if (giftOpened) {
        return;
    }

    giftOpened = true;
    gift.classList.add("pressing");
    gift.classList.add("opened");

    setTimeout(() => {
        gift.classList.remove("pressing");
    }, 420);

    createEmojiExplosion();
    createConfetti();

    setTimeout(() => {
        switchScreen(giftScreen, finalScreen);
    }, 500);

    setTimeout(() => {
        emoji.classList.add("show");
    }, 700);

    setTimeout(() => {
        finalName.textContent = userName;
        finalText.classList.add("show");
    }, 1250);
}


/* =========================
   EMOJI EXPLOSION
========================= */

function createEmojiExplosion() {
    const emojis = ["🖕", 
                    "🖕", 
                    "🖕", 
                    "🖕", 
                    "🖕", 
                    "🖕",
                    "🖕", 
                    "🖕", 
                    "🖕", 
                    "🖕", 
                    "🖕",
                    "🖕"
                ];

    for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.className = "particle";
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = "50%";
        el.style.top = "50%";

        const angle = (Math.PI * 2 / 18) * i + (Math.random() - 0.5) * 0.9;
        const distance = 120 + Math.random() * 210;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        el.style.setProperty("--x", x + "px");
        el.style.setProperty("--y", (y - 24) + "px");
        el.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
        el.style.animationDelay = (Math.random() * 0.12) + "s";
        el.style.transform = "translate(-50%, -50%)";
        el.style.fontSize = (16 + Math.random() * 18) + "px";

        document.body.appendChild(el);

        setTimeout(() => {
            el.remove();
        }, 1700);
    }
}


/* =========================
   CONFETTI
========================= */

function createConfetti() {
    const symbols = ["◆", "●", "■", "★", "✦"];

    for (let i = 0; i < 90; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        const hue = Math.random() * 360;
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.fontSize = (8 + Math.random() * 12) + "px";
        confetti.style.background = `linear-gradient(180deg, hsla(${hue}, 100%, 80%, 1), hsla(${hue}, 100%, 60%, 0.6))`;
        confetti.style.animationDuration = (2.4 + Math.random() * 2.6) + "s";
        confetti.style.animationDelay = (Math.random() * 0.7) + "s";
        confetti.style.setProperty("--drift", (Math.random() * 280 - 140) + "px");

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5600);
    }
}


/* =========================
   DOUBLE TAP PREVENT
========================= */

document.addEventListener("dblclick", function (e) {
    e.preventDefault();
});

</script>
